{% extends "base.html" %}

{% block content %}
<div style="max-width: 700px; margin: 0 auto;">
    <h2 style="font-weight: 700; font-size: 1.8rem; color: #0f172a; text-align: center;">
        <i class="fas fa-cloud-upload-alt" style="color: #f97316;"></i> Upload Files
    </h2>
    <p style="text-align: center; color: #64748b; margin-bottom: 2rem;">
        Drag &amp; drop your files here, or click to browse.
    </p>

    <form method="POST" enctype="multipart/form-data" action="{{ url_for('upload') }}" id="uploadForm">
        <div style="border: 3px dashed #cbd5e1; border-radius: 20px; padding: 3rem 2rem; text-align: center; background: #f8fafc; transition: 0.2s; cursor: pointer;" 
             onmouseover="this.style.borderColor='#f97316'; this.style.background='#fef3c7';" 
             onmouseout="this.style.borderColor='#cbd5e1'; this.style.background='#f8fafc';"
             onclick="document.getElementById('fileInput').click();">
            
            <i class="fas fa-file-upload" style="font-size: 4rem; color: #94a3b8; margin-bottom: 1rem;"></i>
            <p style="font-weight: 600; color: #1e293b; font-size: 1.1rem;">Choose files or drag them here</p>
            <p style="font-size: 0.9rem; color: #94a3b8;">
                <i class="fas fa-check-circle" style="color: #22c55e;"></i> PDF, PNG, JPG, GIF, SVG, TEX, TXT, HTML
            </p>
            <input type="file" name="file" id="fileInput" multiple required style="display: none;" onchange="document.getElementById('uploadForm').submit();">
        </div>

        <div style="text-align: center; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success" style="font-size: 1.1rem; padding: 12px 40px;">
                <i class="fas fa-upload"></i> Upload Now
            </button>
        </div>
        <p style="text-align: center; margin-top: 0.5rem; font-size: 0.8rem; color: #94a3b8;">
            Maximum file size: 16 MB
        </p>
    </form>

    <div style="margin-top: 2rem; text-align: center;">
        <a href="{{ url_for('index') }}" class="btn btn-outline">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>
</div>
{% endblock %}
